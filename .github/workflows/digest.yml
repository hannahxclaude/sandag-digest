name: SANDAG Regional Agenda Digest

on:
  schedule:
    - cron: '0 15 * * 1'  # Every Monday at 8am PT (UTC-7)
  workflow_dispatch:       # Also allows manual trigger from GitHub

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install chromium --with-deps

      - name: Run SANDAG digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python run_digest.py --no-preview

      - name: Commit seen_agendas.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add seen_agendas.json
          git diff --staged --quiet || git commit -m "Update seen_agendas.json [skip ci]"
          git push
